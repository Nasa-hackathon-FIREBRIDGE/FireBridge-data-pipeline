# Explicitly isolated smoke environment. Never use this override on the live stack.
services:
  history-api:
    volumes: !override
      - ./data/platform-validation:/data
  db:
    cpus: 1
    mem_limit: 1536m
    ports: !override ['127.0.0.1:55433:5432']
  airflow-db:
    cpus: 0.5
    mem_limit: 512m
  airflow-scheduler:
    cpus: 2
    mem_limit: 3g
    environment:
      AIRFLOW__CORE__PARALLELISM: '2'
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '2'
      DBT_THREADS: '1'
      FIREBRIDGE_VALIDATION: isolated-firebridge-validation
    volumes: !override
      - ./data/platform-validation:/data
      - ./data/imports-validation:/imports:ro
      - airflow_logs:/opt/airflow/logs
  airflow-dag-processor:
    cpus: 0.5
    mem_limit: 768m
    environment:
      AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: '1'
    volumes: !override
      - ./data/platform-validation:/data
      - ./data/imports-validation:/imports:ro
      - airflow_logs:/opt/airflow/logs
  airflow-api:
    cpus: 1
    mem_limit: 1536m
    environment:
      AIRFLOW__API__WORKERS: '1'
    ports: !override ['127.0.0.1:8081:8080']
    volumes: !override
      - ./data/platform-validation:/data
      - ./data/imports-validation:/imports:ro
      - airflow_logs:/opt/airflow/logs
  airflow-init:
    cpus: 1
    mem_limit: 1536m
    environment:
      FIREBRIDGE_INGESTION_POOL_SLOTS: '1'
    volumes: !override
      - ./data/platform-validation:/data
      - ./data/imports-validation:/imports:ro
      - airflow_logs:/opt/airflow/logs
  airflow-permissions:
    volumes: !override
      - ./data/platform-validation:/data
      - ./data/imports-validation:/imports
      - airflow_logs:/opt/airflow/logs
