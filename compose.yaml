name: firebridge
services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: firebridge
      POSTGRES_USER: firebridge
      POSTGRES_PASSWORD: ${FIREBRIDGE_DB_PASSWORD:?Run python scripts/init_local.py first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - firebridge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firebridge -d firebridge"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  worker:
    profiles: ["pipeline"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://firebridge:${FIREBRIDGE_DB_PASSWORD}@db:5432/firebridge
      FIREBRIDGE_DATA_DIR: /data
    volumes:
      - ./data/platform:/data
    depends_on:
      db:
        condition: service_healthy
    command: ["firebridge", "worker"]
    restart: unless-stopped
volumes:
  firebridge_pg:
