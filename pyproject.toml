[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "firebridge-data"
version = "0.1.0"
description = "Versioned FIREBRIDGE data ingestion and PostgreSQL/PostGIS publication"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1",
  "pyarrow>=19,<24", "duckdb>=1.3,<2", "python-dotenv>=1.1,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
firebridge = "firebridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
firebridge = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a dedicated PostgreSQL/PostGIS test database", "dbt: runs real dbt transformations against the isolated test database"]
